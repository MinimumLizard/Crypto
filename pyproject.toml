[project]
name = "minilizard-terminal"
version = "0.1.0"
description = "A personal crypto market terminal: static site, rebuilt daily."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=16",
    "pydantic>=2.7",
    "scipy>=1.13",
    "numpy>=1.26",
    "pyyaml>=6.0",
    # The GPR index is published only as a .xls workbook -- no CSV, no API.
    "fastexcel>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
terminal = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
