# ---------------------------------------------------------------------------
# Sector roll-up
# ---------------------------------------------------------------------------
# The tier totals (65/22/13) and the 20% sector cap are checked by
# `terminal validate` against config/weights.yaml, which is not public. Both
# checks passed on the drafted book as of 2026-09-24, with DeFi-DEX sitting
# exactly at the cap.
#
# The numbers are deliberately not written out here: this file is public, and a
# roll-up in a comment is the same disclosure as the weights themselves.
