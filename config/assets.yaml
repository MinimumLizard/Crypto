# Asset registry — DRAFT for confirmation (SPEC §4.1)
#
# NOTHING depends on this file yet. The brief requires it be shown and confirmed
# before any metric is computed from it, so this is a proposal, not a decision.
#
# Identity is resolved by `coingecko_id` and contract address, NEVER by ticker.
# That is not a stylistic preference: probing CoinGecko's 21,550-coin list on
# 2026-09-24 found 7 live coins with the symbol SKY (one of them a Solana
# memecoin), 4 with PUMP, 5 with HYPE and 3 with TAO. Two of the book's names
# also have ids that do not resemble their ticker at all:
#     FLUID -> instadapp        (the token renamed, the CoinGecko id did not)
#     CFG   -> centrifuge-2     ("centrifuge" is the OLD, dead entry)
#     MORPHO-> morpho           ("morpho-2" is "Legacy Morpho")
#     PUMP  -> pump-fun         ("pump" is an unrelated Blast token)
# Resolving any of these by ticker would silently price the wrong asset.
#
# FIELD NOTES
#   defillama: DefiLlama nests protocols under a PARENT. Fees/revenue must be
#     read from the parent slug, which aggregates the versions; listing the
#     children and summing them double-counts. `llama_parent` is the slug to
#     query; `llama_children` is recorded only so the aggregate can be audited.
#   binance_spot: null means NO Binance pair exists. That matters beyond data
#     sourcing — MiniLizard (§7.1) is DEFINED on Binance bars, so a name with
#     no Binance pair cannot be parity-tested and its regime score is computed
#     on a documented substitute. Those names are flagged `parity: substitute`.
#   coinmetrics: only BTC and ETH have community-tier coverage worth having.
#
# VERIFICATION STATUS as of 2026-09-24, from live calls:
#   - coingecko_id + contracts: verified against /coins/list?include_platform=true
#   - binance_spot: verified against data-api.binance.vision exchangeInfo (TRADING)
#   - coinbase: verified against api.exchange.coinbase.com/products (online)
#   - hl_perp / hl_spot: verified against Hyperliquid metaAndAssetCtxs + spotMeta
#   - llama_parent: verified to return 200 on /summary/fees/{slug}
#   - sectors and tiers: taken from the brief §4.2 verbatim, unverified
#   - TARGET WEIGHTS ARE NOT IN THIS FILE. This repository is public, and §12
#     asks for the §4.2 weights to be redacted from anything public, so they
#     live in `config/weights.yaml`, which is gitignored. See D009 — if you are
#     happy for the weights to be public, moving them back is a one-line change.
#   - custody / gas / thesis / triggers: PROPOSED BY ME — these need your review

meta:
  drafted: 2026-09-24
  status: awaiting-confirmation
  tier_targets: {1: 65, 2: 22, 3: 13}   # percent
  sector_cap_pct: 20

