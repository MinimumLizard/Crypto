# Target weights — EXAMPLE. Copy to config/weights.yaml and fill in.
#
# GITIGNORED ON PURPOSE. This repository is public and §12 asks for these
# weights to be kept out of public material. `config/assets.yaml` holds the
# identity and venue data, which is not sensitive; this file holds the book.
#
# The pipeline reads this when present. When it is absent — a fresh clone, or
# a contributor who is not you — the weight-dependent panels (drift, tier
# totals, sector cap, next buy) render as "not configured" rather than
# guessing or showing zeros.

