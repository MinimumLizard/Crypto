# Lint and tests on every push. The deploy workflow runs these too, so a red
# build can never reach Pages.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check pipeline tools tests

      - name: Tests
        # The quantile replication gate needs BTC history, which is not in this
        # checkout, so that one test skips here and runs in the deploy job where
        # the data branch IS checked out. It is never silently dropped.
        run: uv run pytest -q

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: site
      - run: npm run build
        working-directory: site
